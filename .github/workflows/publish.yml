name: Publish course maps

# Weekly: download the Geofabrik extracts listed in regions.txt, build every
# region, publish the result to GitHub Pages and commit the quality reports.
# The commit also keeps the schedule alive, because GitHub switches scheduled
# workflows off in a repository with no activity for 60 days.

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  # The project is a set of scripts, not an installed package.
  PYTHONPATH: src

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run pytest
      - name: Download the extracts and build every region
        run: uv run python -m golf_course_maps.cli build-all regions.txt data out
      - name: Collect the quality reports
        run: |
          rm -rf reports # the checkout already has last week's
          mkdir reports
          (cd out && find . -name report.md -exec cp --parents {} ../reports \;)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  commit-reports:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Clear the old reports, so a removed region's report goes too
        run: rm -rf reports
      - uses: actions/download-artifact@v8
        with:
          name: reports
          path: reports
      - name: Commit the reports if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "Reports unchanged"
          else
            git commit -m "Quality reports $(date -u +%F)"
            git push
          fi
